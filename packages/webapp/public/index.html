<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gottesdienst-Vorbereitung</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg:#f4f4f4; --fg:#373737; --muted:#6b6b6b; --card:#fff; --accent:#0078bb; --accent-dark:#005f96; --line:#e2e2e2; --err:#c62828; --tint:#eaf3f9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161a1d; --fg:#e6e9ec; --muted:#9aa3ab; --card:#1f2428; --accent:#4aa3da; --accent-dark:#6bb6e6; --line:#2e353b; --err:#ef8a8a; --tint:#1b2a35; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:300 17px/1.6 Roboto, system-ui, sans-serif; }
  header.top { background:var(--accent); color:#fff; }
  header.top .in { max-width:880px; margin:0 auto; padding:28px 20px 22px; }
  header.top h1 { font:700 clamp(1.7rem, 4vw, 2.4rem)/1.1 "Roboto Condensed", Roboto, sans-serif; text-transform:uppercase; letter-spacing:.02em; margin:0; }
  header.top p { margin:6px 0 0; font-weight:300; opacity:.9; }
  main { max-width:880px; margin:0 auto; padding:0 20px 72px; }
  ol.steps { display:flex; list-style:none; padding:0; margin:0 0 28px; background:var(--card); box-shadow:0 2px 6px rgba(0,0,0,.08); border-radius:0 0 3px 3px; overflow-x:auto; }
  ol.steps li { flex:1; padding:14px 16px; white-space:nowrap; text-align:center; font:400 .95rem "Roboto Condensed", Roboto, sans-serif; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-bottom:3px solid transparent; }
  ol.steps li.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }
  ol.steps li.done { color:var(--fg); border-bottom-color:var(--line); }
  .card { background:var(--card); border-radius:3px; padding:28px 32px; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  @media (max-width:560px) { .card { padding:20px 16px; } }
  label { display:block; font:700 .85rem "Roboto Condensed", Roboto, sans-serif; text-transform:uppercase; letter-spacing:.06em; margin:20px 0 6px; color:var(--fg); }
  label:first-child { margin-top:0; }
  input[type=text], input[type=date], input[type=number], textarea, select {
    width:100%; padding:11px 12px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-bottom:2px solid var(--muted); border-radius:3px; transition:border-color .15s, box-shadow .15s; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); border-bottom-color:var(--accent); box-shadow:0 0 0 3px var(--tint); }
  textarea { min-height:110px; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:10px; } .row > input { flex:1; min-width:200px; }
  .hint { color:var(--muted); font-size:.88rem; margin:6px 0 0; }
  .actions { display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; }
  button { font:700 .95rem "Roboto Condensed", Roboto, sans-serif; text-transform:uppercase; letter-spacing:.08em; padding:11px 24px; border-radius:3px; border:2px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; transition:background .15s, color .15s; }
  button:hover:not(:disabled) { background:var(--accent-dark); border-color:var(--accent-dark); }
  button.secondary { background:transparent; color:var(--accent); }
  button.secondary:hover:not(:disabled) { background:var(--tint); color:var(--accent-dark); border-color:var(--accent-dark); }
  button:focus-visible { outline:3px solid var(--tint); outline-offset:2px; }
  button:disabled { opacity:.45; cursor:default; }
  .err { color:var(--err); margin-top:14px; font-weight:400; } .hidden { display:none; }
  .spoken { padding:16px 20px; border-left:4px solid var(--accent); background:var(--tint); margin:0 0 8px; font-size:1.05rem; }
  .spoken b { font:700 .85rem "Roboto Condensed", Roboto, sans-serif; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); }
  .slot { margin:0; }
  .choice label { font:300 1rem Roboto, sans-serif; text-transform:none; letter-spacing:0; display:flex; gap:10px; align-items:center; margin:10px 0; }
  .meta { font:400 1rem "Roboto Condensed", Roboto, sans-serif; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 18px; } .meta b { color:var(--fg); font-weight:700; }
  .card img { display:block; width:100%; height:auto; border-radius:3px; margin-top:8px; }
  .card a { color:var(--accent); } code { font-size:.9em; word-break:break-all; }
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>Gottesdienst-Vorbereitung</h1>
  <p>Bibeltexte, Perikopen und Bild zum Wochenspruch</p>
</div></header>
<main>
  <ol class="steps" id="steps">
    <li>1 · Datum</li><li>2 · Lesungen</li><li>3 · Bild</li><li>4 · Ergebnis</li>
  </ol>
  <div class="card" id="view"></div>
</main>
<script>
const state = { step: 0, caps: { image:false, ollama:false }, form: { date:'', ordnung:'de' }, lect: null, slots: {}, result: null };
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function renderSteps() {
  [...$('#steps').children].forEach((li, i) => li.className = i === state.step ? 'active' : i < state.step ? 'done' : '');
}

function view(html) { $('#view').innerHTML = html; renderSteps(); }

function stepDate(msg) {
  state.step = 0;
  const f = state.form;
  view(`
    <label for="date">Datum des Gottesdienstes</label>
    <input type="date" id="date" value="${esc(f.date)}">
    <label for="ordnung">Perikopenordnung</label>
    <select id="ordnung">
      <option value="de" ${f.ordnung==='de'?'selected':''}>Deutsch (EKD) – mit Wochenspruch, Psalm, Evangelium</option>
      <option value="ch" ${f.ordnung==='ch'?'selected':''}>Schweizerisch (pfarrverein.ch)</option>
    </select>
    <div id="sunday" class="hidden"></div>
    <p class="err ${msg?'':'hidden'}" id="err">${esc(msg)}</p>
    <div class="actions"><button id="next">Weiter</button></div>`);
  $('#next').onclick = () => loadLect($('#date').value, $('#ordnung').value);
}

async function loadLect(date, ordnung) {
  if (!date) return stepDate('Bitte ein Datum wählen.');
  state.form = { date, ordnung };
  $('#next').disabled = true; $('#next').textContent = 'Lade …';
  try {
    const l = await api('/api/lectionary', { date, ordnung });
    if (!l.sunday) return stepNoSunday(l);
    state.lect = l;
    state.slots = {
      at: { reference: l.at, perikope: !!l.at },
      nt: { reference: l.nt, perikope: !!l.nt },
      predigttext: { reference: l.predigttext, perikope: !!l.predigttext },
    };
    stepReadings();
  } catch (e) { stepDate(e.message); }
}

function fmt(d) { const [y,m,t] = d.split('-'); return `${t}.${m}.${y}`; }

function stepNoSunday(l) {
  state.step = 0;
  view(`
    <p>Der <b>${fmt(state.form.date)}</b> ist kein Sonntag.</p>
    <div class="choice">
      <label><input type="radio" name="o" value="${l.prevSunday}" checked> Perikopen des vorherigen Sonntags (${fmt(l.prevSunday)})</label>
      <label><input type="radio" name="o" value="${l.nextSunday}"> Perikopen des nächsten Sonntags (${fmt(l.nextSunday)})</label>
      <label><input type="radio" name="o" value="manual"> Bibelstellen manuell eingeben</label>
    </div>
    <div class="actions"><button class="secondary" id="back">Zurück</button><button id="next">Weiter</button></div>`);
  $('#back').onclick = () => stepDate();
  $('#next').onclick = () => {
    const v = $('input[name=o]:checked').value;
    if (v === 'manual') {
      state.lect = { sunday:false, date: state.form.date, ordnung: state.form.ordnung, sundayName:'' };
      state.slots = { at:{reference:''}, nt:{reference:''}, predigttext:{reference:''} };
      stepReadings();
    } else loadLect(v, state.form.ordnung);
  };
}

function slotRow(key, label) {
  const s = state.slots[key] ?? { reference:'' };
  const sug = state.lect[key] || '';
  return `<div class="slot"><label for="s_${key}">${label}</label>
    <input type="text" id="s_${key}" value="${esc(s.reference)}" placeholder="z.B. Jes 55,1-5 (leer = überspringen)">
    ${sug ? `<p class="hint">Perikopenordnung: ${esc(sug)}</p>` : ''}</div>`;
}

function stepReadings(msg) {
  state.step = 1;
  const l = state.lect, de = l.sunday && state.form.ordnung === 'de';
  view(`
    <p class="meta"><b>${esc(l.sundayName || 'Gottesdienst')}</b> · ${fmt(l.date)}${l.season ? ' · ' + esc(l.season) : ''}${l.color ? ' · ' + esc(l.color) : ''}</p>
    ${de && l.wochenspruch ? `<div class="spoken"><b>Wochenspruch (${esc(l.wochenspruch.reference)})</b><br>${esc(l.wochenspruch.text)}</div>` : ''}
    ${de ? `<p class="hint">Evangelium: ${esc(l.evangelium)} · Wochenpsalm: ${esc(l.wochenpsalm)}</p>` : ''}
    ${slotRow('at','Lesung Altes Testament')}${slotRow('nt','Lesung Neues Testament')}${slotRow('predigttext','Predigttext')}
    <p class="err ${msg?'':'hidden'}">${esc(msg)}</p>
    <div class="actions"><button class="secondary" id="back">Zurück</button><button id="next">${state.caps.image && de && l.wochenspruch ? 'Weiter zum Bild' : 'HTML erzeugen'}</button></div>`);
  $('#back').onclick = () => stepDate();
  $('#next').onclick = () => {
    const slots = {};
    for (const k of ['at','nt','predigttext']) {
      const ref = $('#s_' + k).value.trim();
      slots[k] = { reference: ref, perikope: !!ref && ref === (l[k] || '') };
    }
    if (de) {
      slots.evangelium = { reference: l.evangelium };
      slots.wochenpsalm = { reference: l.wochenpsalm };
      if (l.wochenspruch) slots.wochenspruch = { reference: l.wochenspruch.reference, fallbackText: l.wochenspruch.text };
    }
    state.collected = slots;
    state.skipImage = true;
    if (state.caps.image && de && l.wochenspruch) stepImage(); else generate();
  };
}

async function generate(msg) {
  const l = state.lect, de = l.sunday && state.form.ordnung === 'de';
  view(`<p>Erzeuge HTML …</p>`);
  try {
    state.result = await api('/api/generate', {
      date: l.date, ordnung: state.form.ordnung, deOnly: de,
      sundayName: l.sundayName, colorRaw: l.colorRaw, seasonRaw: l.seasonRaw, slots: state.collected, image: !state.skipImage });
    stepResult();
  } catch (e) { stepReadings(e.message); }
}

function defaultSeed() { const [y,m,d] = state.lect.date.split('-').map(Number); return Date.UTC(y, m-1, d) / 1000; }

async function runJob(path, body, onTick) {
  const { id } = await api(path, body);
  for (;;) {
    await new Promise(r => setTimeout(r, 2000));
    const j = await api('/api/jobs/' + id);
    if (j.status === 'running') { onTick(j.elapsed); continue; }
    if (j.status === 'error') throw new Error(j.error);
    return j.result;
  }
}

function stepImage() {
  state.step = 2;
  const l = state.lect, im = state.image ??= { prompt:'', seed: defaultSeed(), final:null };
  view(`
    <div class="spoken"><b>Wochenspruch (${esc(l.wochenspruch.reference)})</b><br>${esc(l.wochenspruch.text)}</div>
    <label for="prompt">Bild-Prompt (englisch)</label>
    <textarea id="prompt" placeholder="z.B. Watercolor illustration of a small oil lamp glowing on a stone windowsill at dawn, … no text, no people, wide 16:9 composition, calm uncluttered area at the top for text">${esc(im.prompt)}</textarea>
    ${state.caps.ollama ? `<div class="row"><input type="text" id="hint" placeholder="Wunsch ans Motiv (optional, deutsch oder englisch)"><button class="secondary" id="suggest" style="flex:0 0 auto">Prompt vorschlagen</button></div>` : `<p class="hint">Ollama nicht verfügbar – Prompt bitte von Hand eingeben.</p>`}
    <p class="hint">Keine Hände, Gesichter oder Text im Motiv. Ruhige Fläche oben lassen (Text wird dort eingebrannt).</p>
    <label for="seed">Seed</label>
    <input type="number" id="seed" min="0" step="1" value="${im.seed}">
    <p class="hint">Vorschlag: Mitternacht UTC des Gottesdienst-Datums.</p>
    <div class="actions">
      <button id="fin">${im.final ? 'Neu erzeugen' : 'Bild erzeugen'} (1920×1080, ca. 5 min)</button>
    </div>
    <p id="status" class="hint"></p><p class="err hidden" id="err"></p>
    <div id="pics">${im.final ? finalHtml(im.final) : ''}</div>
    <div class="actions">
      <button class="secondary" id="back">Zurück</button>
      <button class="secondary" id="skip">Ohne Bild weiter</button>
      <button id="done" ${im.final ? '' : 'disabled'}>HTML erzeugen</button>
    </div>`);
  const input = () => { im.prompt = $('#prompt').value.trim(); im.seed = Number($('#seed').value); return { date:l.date, sundayName:l.sundayName, prompt:im.prompt, seed:im.seed }; };
  const busy = on => ['fin','back','skip','done',...(state.caps.ollama ? ['suggest'] : [])].forEach(i => $('#'+i).disabled = on || (i === 'done' && !im.final));
  const run = async (path, extra, label) => {
    $('#err').classList.add('hidden');
    busy(true);
    try {
      return await runJob(path, { ...input(), ...extra }, s => $('#status').textContent = `${label} … ${s} s`);
    } catch (e) { $('#err').textContent = e.message; $('#err').classList.remove('hidden'); return null; }
    finally { $('#status').textContent = ''; busy(false); }
  };
  const suggest = async () => {
    $('#err').classList.add('hidden');
    busy(true); $('#status').textContent = 'Ollama schreibt den Prompt …';
    try {
      const w = l.wochenspruch;
      const r = await api('/api/prompt', { reference: w.reference, text: w.text, hint: $('#hint').value });
      $('#prompt').value = r.prompt; im.prompt = r.prompt; im.final = null;
    } catch (e) { $('#err').textContent = e.message; $('#err').classList.remove('hidden'); }
    finally { $('#status').textContent = ''; busy(false); }
  };
  if (state.caps.ollama) $('#suggest').onclick = suggest;
  if (state.caps.ollama && !im.prompt) suggest();
  $('#fin').onclick = async () => {
    if (!$('#prompt').value.trim()) { $('#err').textContent = 'Bitte einen Prompt eingeben.'; $('#err').classList.remove('hidden'); return; }
    const w = l.wochenspruch;
    const r = await run('/api/image/final', { reference: w.reference, fallbackText: w.text }, 'Bild wird erzeugt (ca. 5 min)');
    if (r) { im.final = r; stepImage(); }
  };
  $('#back').onclick = () => stepReadings();
  $('#skip').onclick = () => { state.skipImage = true; generate(); };
  $('#done').onclick = () => { state.skipImage = false; generate(); };
}

function finalHtml(f) {
  return `<p class="hint">Mit Wochenspruch:</p><img src="${f.withText || f.plain}" style="max-width:100%">
    <p class="hint">Ohne Text:</p><img src="${f.plain}" style="max-width:100%">`;
}

function stepResult() {
  state.step = 3;
  view(`
    <p>Gespeichert: <code>${esc(state.result.file)}</code></p>
    <p><a href="${state.result.url}" target="_blank" rel="noopener">HTML öffnen</a></p>
    <div class="actions"><button id="again">Neuer Gottesdienst</button></div>`);
  $('#again').onclick = () => { state.step = 0; state.lect = null; state.image = null; state.skipImage = false; stepDate(); };
}

api('/api/capabilities').then(c => { state.caps = c; }).catch(() => {}).finally(() => stepDate());
</script>
</body>
</html>
